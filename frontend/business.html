<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Setup | UNNATI</title>

    <link rel="stylesheet" href="css/setup.css">
</head>

<body>

    <header class="setup-header">

        <a href="index.html" class="setup-brand">
    <img
        src="assets/unnati-logo.png"
        alt="Unnati logo"
        class="setup-brand-logo"
    >

    <div class="setup-brand-text">
        <span>UNNATI</span>
        <small>Know your market. Grow your business.</small>
    </div>
</a>

        <div class="step-text" data-i18n="step2of3">
            Step 2 of 3
        </div>

    </header>


    <main class="setup-container">

        <!-- Progress -->
        <div class="progress-area">

            <div class="progress-step completed">
                <span>✓</span>
                <span data-i18n="location">Location</span>
            </div>

            <div class="progress-line completed-line"></div>

            <div class="progress-step active">
                <span>2</span>
                <span data-i18n="business">Business</span>
            </div>

            <div class="progress-line"></div>

            <div class="progress-step">
                <span>3</span>
                <span data-i18n="capital">Capital</span>
            </div>

        </div>


        <!-- Business Card -->
        <section class="setup-card">

            <div class="setup-title">

                <button
                    type="button"
                    class="back-button"
                    id="backBtn"
                >
                    ←
                </button>

                <div>

                    <h1 data-i18n="businessTitle">
                        What business are you planning?
                    </h1>

                    <p data-i18n="businessDescription">
                        Choose the category that best describes
                        your business idea.
                    </p>

                </div>

            </div>


            <form id="businessForm">

                <div class="business-grid">

                    <!-- Dairy -->
                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Dairy"
                        >

                        <div class="business-content">
                            <div class="business-icon">🐄</div>

                            <strong data-i18n="dairy">
                                Dairy
                            </strong>

                            <small data-i18n="dairyDescription">
                                Milk & dairy products
                            </small>
                        </div>

                    </label>


                    <!-- Retail -->
                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Retail"
                        >

                        <div class="business-content">
                            <div class="business-icon">🏪</div>

                            <strong data-i18n="retail">
                                Retail
                            </strong>

                            <small data-i18n="retailDescription">
                                Local shop & trading
                            </small>
                        </div>

                    </label>


                    <!-- Textiles -->
                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Textiles"
                        >

                        <div class="business-content">
                            <div class="business-icon">👕</div>

                            <strong data-i18n="textiles">
                                Textiles
                            </strong>

                            <small data-i18n="textilesDescription">
                                Clothing & tailoring
                            </small>
                        </div>

                    </label>


                    <!-- Agriculture -->
                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Agriculture"
                        >

                        <div class="business-content">
                            <div class="business-icon">🌱</div>

                            <strong data-i18n="agriculture">
                                Agriculture
                            </strong>

                            <small data-i18n="agricultureDescription">
                                Farming & produce
                            </small>
                        </div>

                    </label>


                    <!-- Food -->
                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Food"
                        >

                        <div class="business-content">
                            <div class="business-icon">🌾</div>

                            <strong data-i18n="food">
                                Food
                            </strong>

                            <small data-i18n="foodDescription">
                                Food & processing
                            </small>
                        </div>

                    </label>


                    <!-- Poultry -->
                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Poultry"
                        >

                        <div class="business-content">
                            <div class="business-icon">🐔</div>

                            <strong data-i18n="poultry">
                                Poultry
                            </strong>

                            <small data-i18n="poultryDescription">
                                Birds & eggs
                            </small>
                        </div>

                    </label>


                    <!-- Services -->
                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Services"
                        >

                        <div class="business-content">
                            <div class="business-icon">🛠️</div>

                            <strong data-i18n="services">
                                Services
                            </strong>

                            <small data-i18n="servicesDescription">
                                Local services
                            </small>
                        </div>

                    </label>


                    <!-- Other -->
                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Other"
                            id="otherBusiness"
                        >

                        <div class="business-content">
                            <div class="business-icon">•••</div>

                            <strong data-i18n="other">
                                Other
                            </strong>

                            <small data-i18n="otherDescription">
                                Something else
                            </small>
                        </div>

                    </label>

                </div>


                <!-- Other Business Input -->
                <div
                    class="other-business-container"
                    id="otherBusinessContainer"
                    style="display: none;"
                >

                    <label
                        for="otherBusinessInput"
                        data-i18n="otherBusinessLabel"
                    >
                        Enter your business type
                    </label>

                    <input
                        type="text"
                        id="otherBusinessInput"
                        data-i18n-placeholder="otherBusinessPlaceholder"
                        placeholder="e.g. Handicrafts, Mobile Repair, Beauty Parlour"
                    >

                </div>


                <div class="form-footer">

                    <span data-i18n="changeLater">
                        You can change this later.
                    </span>

                    <button
                        type="submit"
                        class="continue-btn"
                        data-i18n="continue"
                    >
                        Continue →
                    </button>

                </div>

            </form>

        </section>


        <p class="privacy-note" data-i18n="privacyNote">
            🔒 Your information is used only to personalize your business analysis.
        </p>

    </main>


    <script src="js/setup.js"></script>
    <script src="js/language.js"></script>

</body>

</html>
