<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Setup | GramBiz AI</title>

    <link rel="stylesheet" href="css/setup.css">
</head>

<body>

    <header class="setup-header">

        <a href="index.html" class="logo">
            🌱 GramBiz <strong>AI</strong>
        </a>

        <div class="step-text">
            Step 2 of 3
        </div>

    </header>


    <main class="setup-container">

        <!-- Progress -->
        <div class="progress-area">

            <div class="progress-step completed">
                <span>✓</span>
                Location
            </div>

            <div class="progress-line completed-line"></div>

            <div class="progress-step active">
                <span>2</span>
                Business
            </div>

            <div class="progress-line"></div>

            <div class="progress-step">
                <span>3</span>
                Capital
            </div>

        </div>


        <!-- Business Card -->
        <section class="setup-card">

            <div class="setup-title">

                <button class="back-button" id="backBtn">
                    ←
                </button>

                <div>
                    <h1>What business are you planning?</h1>

                    <p>
                        Choose the category that best describes
                        your business idea.
                    </p>
                </div>

            </div>


            <form id="businessForm">

                <div class="business-grid">

                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Dairy"
                        >

                        <div class="business-content">
                            <div class="business-icon">🐄</div>
                            <strong>Dairy</strong>
                            <small>Milk & dairy products</small>
                        </div>

                    </label>


                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Retail"
                        >

                        <div class="business-content">
                            <div class="business-icon">🏪</div>
                            <strong>Retail</strong>
                            <small>Local shop & trading</small>
                        </div>

                    </label>


                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Textiles"
                        >

                        <div class="business-content">
                            <div class="business-icon">👕</div>
                            <strong>Textiles</strong>
                            <small>Clothing & tailoring</small>
                        </div>

                    </label>


                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Agriculture"
                        >

                        <div class="business-content">
                            <div class="business-icon">🌱</div>
                            <strong>Agriculture</strong>
                            <small>Farming & produce</small>
                        </div>

                    </label>


                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Food"
                        >

                        <div class="business-content">
                            <div class="business-icon">🌾</div>
                            <strong>Food</strong>
                            <small>Food & processing</small>
                        </div>

                    </label>


                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Poultry"
                        >

                        <div class="business-content">
                            <div class="business-icon">🐔</div>
                            <strong>Poultry</strong>
                            <small>Birds & eggs</small>
                        </div>

                    </label>


                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Services"
                        >

                        <div class="business-content">
                            <div class="business-icon">🛠️</div>
                            <strong>Services</strong>
                            <small>Local services</small>
                        </div>

                    </label>


                    <label class="business-option">

                        <input
                            type="radio"
                            name="business"
                            value="Other"
                        >

                        <div class="business-content">
                            <div class="business-icon">•••</div>
                            <strong>Other</strong>
                            <small>Something else</small>
                        </div>

                    </label>

                </div>


                <div class="form-footer">

                    <span>
                        You can change this later.
                    </span>

                    <button
                        type="submit"
                        class="continue-btn"
                    >
                        Continue →
                    </button>

                </div>

            </form>

        </section>


        <p class="privacy-note">
            🔒 Your information is used only to personalize your business analysis.
        </p>

    </main>


    <script src="js/setup.js"></script>

</body>

</html>
