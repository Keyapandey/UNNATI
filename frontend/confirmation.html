<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review | GramBiz AI</title>

    <link rel="stylesheet" href="css/setup.css">
</head>

<body>

    <header class="setup-header">

        <a href="index.html" class="logo">
            🌱 GramBiz <strong>AI</strong>
        </a>

        <div class="step-text" data-i18n="finalReview">
            Final Review
        </div>

    </header>


    <main class="setup-container">

        <!-- Progress -->

        <div class="progress-area">

            <div class="progress-step completed">
                <span>✓</span>
                <span data-i18n="location">Location</span>
            </div>

            <div class="progress-line completed-line"></div>

            <div class="progress-step completed">
                <span>✓</span>
                <span data-i18n="business">Business</span>
            </div>

            <div class="progress-line completed-line"></div>

            <div class="progress-step completed">
                <span>✓</span>
                <span data-i18n="capital">Capital</span>
            </div>

        </div>


        <!-- Confirmation Card -->

        <section class="setup-card confirmation-card">

            <div class="setup-title">

                <div>

                    <h1 data-i18n="reviewTitle">
                        Review your details
                    </h1>

                    <p data-i18n="reviewDescription">
                        Make sure everything looks correct
                        before we start your AI analysis.
                    </p>

                </div>

            </div>


            <!-- LOCATION -->

            <div class="review-section">

                <div class="review-heading">
                    <span>📍</span>
                    <strong data-i18n="location">
                        Location
                    </strong>
                </div>

                <div
                    class="review-value"
                    id="locationValue"
                >
                    Loading...
                </div>

            </div>


            <!-- BUSINESS -->

            <div class="review-section">

                <div class="review-heading">
                    <span>🏪</span>
                    <strong data-i18n="business">
                        Business
                    </strong>
                </div>

                <div
                    class="review-value"
                    id="businessValue"
                >
                    Loading...
                </div>

            </div>


            <!-- CAPITAL -->

            <div class="review-section">

                <div class="review-heading">
                    <span>💰</span>
                    <strong data-i18n="availableCapital">
                        Available Capital
                    </strong>
                </div>

                <div
                    class="review-value capital-value"
                    id="capitalValue"
                >
                    Loading...
                </div>

            </div>


            <!-- ACTIONS -->

            <div class="confirmation-actions">

                <button
                    type="button"
                    class="back-button"
                    id="reviewBackBtn"
                    aria-label="Go Back"
                >
                    ←
                </button>

                <button
                    type="button"
                    class="continue-btn"
                    id="startAnalysisBtn"
                    data-i18n="startAIAnalysis"
                >
                    Start AI Analysis →
                </button>

            </div>

        </section>


        <p
            class="privacy-note"
            data-i18n="privacyNote"
        >
            🔒 Your information is used only to
            personalize your business analysis.
        </p>

    </main>


    <script src="js/confirmation.js"></script>
    <script src="js/language.js"></script>

</body>

</html>
