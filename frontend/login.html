<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GramBiz AI</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-brand">
            <a href="index.html" class="logo">
                🌱 GramBiz <strong>AI</strong>
            </a>

            <h1 data-i18n="welcomeBack">Welcome back.</h1>

            <p data-i18n="loginWelcomeText">
                Login to continue building and growing your business
                with GramBiz AI.
            </p>
        </div>


        <div class="auth-language">

    <select
        id="languageSelector"
        aria-label="Select Language"
    >

        <option value="en">English</option>
        <option value="hi">हिन्दी</option>

    </select>

</div>

        <div class="auth-card">

            <h2 data-i18n="loginTitle">
                Login to GramBiz AI
            </h2>

            <p data-i18n="loginSubtitle">
                Enter your details to continue.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email" data-i18n="emailAddress">Email address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox">
                        <span data-i18n="rememberMe">Remember me</span>
                    </label>

                    <a href="#" data-i18n="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn">
                    <span data-i18n="login">Login</span>
                    <span>→</span>
                </button>

            </form>


            <div class="divider">
                <span data-i18n="or">or</span>
            </div>


            <p class="switch-auth">
                <span data-i18n="noAccount">Don't have an account?</span>
                <a href="signup.html" data-i18n="createAccount">Create an account</a>
            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/language.js"></script>
</body>
</html>
