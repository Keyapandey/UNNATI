<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Location | GramBiz AI</title>

    <link rel="stylesheet" href="css/setup.css">
</head>

<body>

<header class="setup-header">

    <a href="index.html" class="logo">
        🌱 GramBiz <strong>AI</strong>
    </a>

    <div class="step-text" data-i18n="step1of3">
        Step 1 of 3
    </div>

</header>


<main class="setup-container">

    <div class="progress-area">

        <div class="progress-step active">
            <span>1</span>
            <span data-i18n="location">Location</span>
        </div>

        <div class="progress-line"></div>

        <div class="progress-step">
            <span>2</span>
            <span data-i18n="business">Business</span>
        </div>

        <div class="progress-line"></div>

        <div class="progress-step">
            <span>3</span>
            <span data-i18n="capital">Capital</span>
        </div>

    </div>


    <section class="setup-card">

        <div class="setup-title">

            <div>

                <h1 data-i18n="locationTitle">Where is your business located?</h1>

                <p data-i18n="locationDescription">
                    Your location helps us understand
                    your local market and opportunities.
                </p>

            </div>

        </div>


        <button
            type="button"
            class="location-button"
            id="useLocationBtn"
            data-i18n="useCurrentLocation"
        >
            📍 Use my current location
        </button>


        <div class="or-divider">
            <span data-i18n="or">OR</span>
        </div>


        <form id="locationForm">

            <div class="form-group">

                <label for="village" data-i18n="villageTown">
                    Village / Town
                </label>

                <input
                    type="text"
                    id="village"
                    placeholder="Enter village or town"
                    data-i18n-placeholder="villagePlaceholder"
                    required
                >

            </div>


            <div class="form-group">

                <label for="block" data-i18n="block">
                    Block
                </label>

                <input
                    type="text"
                    id="block"
                    placeholder="Enter block"
                    data-i18n-placeholder="blockPlaceholder"
                    required
                >

            </div>


            <div class="form-group">

                <label for="district" data-i18n="district">
                    District
                </label>

                <input
                    type="text"
                    id="district"
                    placeholder="Enter district"
                    data-i18n-placeholder="districtPlaceholder"
                    required
                >

            </div>


            <div class="form-footer">

                <span data-i18n="changeLater">
                    You can change this later.
                </span>

                <button
                    type="submit"
                    class="continue-btn"
                    data-i18n="continue"
                >
                    Continue →
                </button>

            </div>

        </form>

    </section>


    <p class="privacy-note" data-i18n="privacyNote">
        🔒 Your information is used only to personalize your business analysis.
    </p>

</main>


<script src="js/setup.js"></script>
<script src="js/language.js"></script>

</body>

</html>
